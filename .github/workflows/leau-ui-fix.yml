name: Fix Leau UI

on:
  push:
    branches:
      - rebrand/ol1via-pa

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rebrand/ol1via-pa
          fetch-depth: 0

      - name: Patch Leau eyes animation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/liv/ol1viapa/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('@Composable private fun LeauEyes(')
          end = s.index('@Composable private fun SmallButton', start)
          new = '''@Composable private fun LeauEyes(mode: LeauMode, reduceMotion: Boolean, onClick: () -> Unit) {
    val borderColor = if (mode == LeauMode.LISTENING) LeauGreen else MaterialTheme.colorScheme.outline

    if (reduceMotion) {
        Surface(
            onClick = onClick,
            modifier = Modifier.size(212.dp),
            shape = RoundedCornerShape(48.dp),
            color = MaterialTheme.colorScheme.surface,
            border = BorderStroke(1.dp, borderColor)
        ) {
            Box(Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                Image(
                    painterResource(R.drawable.leau_eyes),
                    "Leau",
                    modifier = Modifier.size(150.dp),
                    contentScale = ContentScale.Fit
                )
            }
        }
        return
    }

    val transition = rememberInfiniteTransition(label = "leau_breathing")
    val hover by transition.animateFloat(
        initialValue = -7f,
        targetValue = 7f,
        animationSpec = infiniteRepeatable(
            animation = tween(3000, easing = FastOutSlowInEasing),
            repeatMode = RepeatMode.Reverse
        ),
        label = "leau_hover"
    )
    val breath by transition.animateFloat(
        initialValue = 0.94f,
        targetValue = 1.06f,
        animationSpec = infiniteRepeatable(
            animation = tween(2400, easing = FastOutSlowInEasing),
            repeatMode = RepeatMode.Reverse
        ),
        label = "leau_breath"
    )
    val listeningPulse by transition.animateFloat(
        initialValue = 0.82f,
        targetValue = 1f,
        animationSpec = infiniteRepeatable(
            animation = tween(800, easing = FastOutSlowInEasing),
            repeatMode = RepeatMode.Reverse
        ),
        label = "leau_listening"
    )

    val cardScale = if (mode == LeauMode.SPEAKING) 1f + ((breath - 1f) * 0.35f) else 1f
    val imageAlpha = if (mode == LeauMode.LISTENING) 0.86f + (0.14f * listeningPulse) else 1f
    val imageScale = breath * if (mode == LeauMode.SPEAKING) 1.02f else 1f

    Box(
        Modifier
            .size(238.dp)
            .offset(y = hover.dp),
        contentAlignment = Alignment.Center
    ) {
        Surface(
            onClick = onClick,
            modifier = Modifier
                .size(212.dp)
                .scale(cardScale),
            shape = RoundedCornerShape(48.dp),
            color = MaterialTheme.colorScheme.surface,
            border = BorderStroke(
                if (mode == LeauMode.LISTENING) 1.5.dp else 1.dp,
                borderColor
            )
        ) {
            Box(Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                Image(
                    painterResource(R.drawable.leau_eyes),
                    "Leau",
                    modifier = Modifier
                        .size(150.dp)
                        .scale(imageScale)
                        .offset(y = (hover * 0.35f).dp)
                        .alpha(imageAlpha),
                    contentScale = ContentScale.Fit
                )
            }
        }
    }
}

'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8', newline='\n')

      - name: Verify Kotlin build
        run: ./gradlew assembleDebug --no-daemon

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/liv/ol1viapa/MainActivity.kt
          git commit -m "Fix Leau breathing and hover animation" || exit 0
          git push origin HEAD:rebrand/ol1via-pa
