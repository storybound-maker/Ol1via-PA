name: Fix main command routing

on:
  push:
    branches: [rebrand/ol1via-pa]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/ol1via-pa
          fetch-depth: 0

      - name: Patch MainActivity
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/liv/ol1viapa/MainActivity.kt')
          s = p.read_text()
          s = s.replace('import android.provider.AlarmClock\n', '')

          start = s.index('        if (lower == "open settings"')
          end = s.index('        if (lower.matches(Regex("^what do you remember', start)

          new = '''        val timerResponse = LeauCommandRouter.timerResponse(context, text)
        if (timerResponse != null) {
            messages.add(ChatMessage(text, false))
            reply(timerResponse)
            return
        }

        if (LeauCommandRouter.callIfRequested(context, text)) {
            messages.add(ChatMessage(text, false))
            reply("Calling now.")
            return
        }

        if (LeauCommandRouter.openRequestedApp(context, text)) {
            messages.add(ChatMessage(text, false))
            reply("Opening it now.")
            return
        }

'''
          s = s[:start] + new + s[end:]
          p.write_text(s)

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-main-command-routing.yml
          git add app/src/main/java/com/liv/ol1viapa/MainActivity.kt .github/workflows/fix-main-command-routing.yml
          git commit -m "Fix main app command routing [skip ci]"
          git push origin rebrand/ol1via-pa
